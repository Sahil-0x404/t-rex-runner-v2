<!-- Original game by Chromium Authors | Jungle Theme by Sahil -->
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>T-Rex: Prehistoric Jungle</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="images/fav_icon.png"/>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css?v=2.5">
</head>

<body id="t" class="offline">

  <!-- ══════════════════════════════════════════════════════════
       START MENU OVERLAY
  ══════════════════════════════════════════════════════════ -->
  <div id="jungle-start-menu" class="jungle-overlay">
    <div class="jungle-panel">
      <div class="title-emoji">🦕</div>
      <h1 class="game-title">T-REX</h1>
      <h2 class="game-subtitle">PREHISTORIC JUNGLE</h2>
      <p class="menu-hint">Click <kbd>PLAY GAME</kbd> to begin</p>

      <div class="menu-buttons">
        <button id="jg-play-btn" class="jg-btn jg-btn-primary">▶&nbsp; PLAY GAME</button>
        <button id="jg-lb-btn-start" class="jg-btn jg-btn-secondary">🏆&nbsp; TOP 5</button>
      </div>

      <div class="controls-hint">
        <span>↑ / SPACE Jump</span>
        <span>↓ Duck</span>
        <span>M Mute</span>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       GAME OVER + LEADERBOARD OVERLAY
  ══════════════════════════════════════════════════════════ -->
  <div id="jungle-gameover" class="jungle-overlay hidden">
    <div class="jungle-panel gameover-panel">

      <h2 id="jg-final-score" class="final-score">SCORE: 0</h2>

      <!-- New high-score name entry -->
      <div id="jg-new-highscore" class="new-hs-section hidden">
        <p class="new-hs-label">🎉 NEW TOP 5 SCORE!</p>
        <input
          id="jg-name-input"
          class="name-input"
          type="text"
          placeholder="Enter your name"
          maxlength="12"
          autocomplete="off"
        />
        <button id="jg-save-btn" class="jg-btn jg-btn-primary">SAVE SCORE</button>
      </div>

      <!-- Leaderboard table -->
      <div class="lb-wrapper">
        <h3 class="lb-title">🌐 GLOBAL HALL OF FAME — TOP 5</h3>
        <table class="lb-table">
          <thead>
            <tr>
              <th>#</th>
              <th>NAME</th>
              <th>SCORE</th>
              <th>DATE</th>
            </tr>
          </thead>
          <tbody id="jg-lb-body"></tbody>
        </table>
      </div>

      <div class="gameover-actions">
        <button id="jg-restart-btn" class="jg-btn jg-btn-primary">🔄&nbsp; PLAY AGAIN</button>
        <button id="jg-menu-btn" class="jg-btn jg-btn-secondary">🏠&nbsp; MAIN MENU</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       HIGH-VISIBILITY IN-GAME HUD (Top Left)
  ══════════════════════════════════════════════════════════ -->
  <div id="jungle-hud" class="jungle-hud">
    <div class="hud-item hud-hi-box">
      <span class="hud-label">HI</span>
      <span id="hud-hi-score" class="hud-val">00000</span>
    </div>
    <div class="hud-item hud-curr-box">
      <span class="hud-label">SCORE</span>
      <span id="hud-current-score" class="hud-val">00000</span>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       AUDIO CONTROLS (top-right corner)
  ══════════════════════════════════════════════════════════ -->
  <div id="jungle-audio-controls" class="audio-controls">
    <button id="jungle-mute-btn" class="mute-btn" title="Toggle Mute (M)">🔊</button>
    <input
      id="jungle-vol-slider"
      class="vol-slider"
      type="range"
      min="0" max="100" value="45"
      title="Volume"
    />
  </div>
